<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport 不可省略
      控制中心在浏览器中打开，没有 viewport 移动端/窄屏会错乱
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expose Yourself — 控制中心</title>
  </head>
  <body>
    <!-- React 挂载点，id 必须和 main.tsx 中 getElementById('root') 一致 -->
    <div id="root"></div>
    <!--
      ★ 最重要的一行
      type="module" — ES Module，才能 import
      src="/src/main.tsx" — 开发态入口，Vite 从这里开始打包
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
